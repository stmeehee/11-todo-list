<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Webpack Project</title>
</head>
<body>

    <div class="logo-div">
        <p>TODO-LIST</p>
    </div>

    <header>
        <div class="toolbar-div">
            <button value="addTodo">Add new task</button>
            <!-- <button>idk1</button>
            <button>idk2</button> -->
        </div>
        <button class="theme-toggle">dark/light</button>
    </header>

    
    <div class="sidebar-div">
        <div class="sidebar-main-div">
            <button value="allTasks">
                <div>
                    <img>
                    <span>All tasks</span>
                </div>            
            </button>
            <button value="UpcomingTasks">
                <div>
                    <img>
                    <span>Upcoming tasks</span>
                </div>            
            </button>    
            <button value="OverdueTasks">
                <div>
                    <img>
                    <span>Overdue tasks</span>
                </div>            
            </button>   
            <button value="DeletedTasks">
                <div>
                    <img>
                    <span>Deleted tasks</span>
                </div>            
            </button>                                 
        </div>      
        <div class="sidebar-projects-div">
            <button value="addProject">
                <div>
                    <span>Add a project</span>
                </div>            
            </button>   
            <div class="user-projects">
                <!--  btn's here added by JS -->
            <button value="project1">
                <div>
                    <span>Project 1</span>
                </div>            
            </button>    
            <button value="project2">
                <div>
                    <span>Project 2</span>
                </div>            
            </button> 
            <button value="project3">
                <div>
                    <span>Project 3</span>
                </div>            
            </button>       
            <button value="project4">
                <div>
                    <span>Project 4</span>
                </div>            
            </button>                                              
            </div>
        </div>          
    </div>

    <main>

        <div class="sort-search-bar-div">
            <p>Sort by:</p>
            <div class="create-date-div">
                <label for="create-date-select">Date created</label>
                <select name="sortByCreationDate" id="create-date-select">
                    <!-- made earlier -->
                    <option value="ascending">Acsending</option> 
                    <!-- made sooner -->
                    <option value="descending">Descending</option>
                </select>
            </div>

            <div class="due-date-div">
                <label for="due-date-select">Date due</label>
                <select name="sortByDueDate" id="due-date-select">
                    <option value="ascending">Due later</option> <!-- past to future -->
                    <option value="descending">Due earlier</option> <!-- due starting from now to later --> 
                </select>
            </div>     
            
            <div class="completed-date-div">
                <label for="completed-date-select">Date completed</label>
                <select name="sortByCompletedDate" id="completed-date-select">
                    <!-- sort finished from past to present -->
                    <option value="ascending">Finished Sooner</option>  
                    <!-- sort finished from present to past-->
                    <option value="descending">Finished Later</option> 
                </select>
            </div>    

            <div class="priority-tag-div">
                <label for="priority-date-select">Priority</label>
                <select name="sortByPriority" id="priority-date-select">
                    <!-- 1 means max priority -->
                    <option value="ascending">Higher priority</option>  
                    <!-- vals < 1 == lower priority -->
                    <option value="descending">Lower priority</option> 
                </select>
            </div> 
                
            <div class="search-div">
                <img>
                <label for="search">Search</label>
                <input type="search" id="search" placeholder="search by title"> 
            </div>

        </div>

        <div class="viewing-div">
            <div class="all-tasks-div">
                <p>All tasks</p>

<!-- example --> <!-- ----------------- -->
                 <div class="full-task-div" id="1a">

                    <div class="progress-bar-btn-div">
                        <div class="task-progress-bar" 
                            data-label="0%" 
                            style="--progress-bar-width: 0%;"
                        ></div>
                        <button popovertarget="tasks-options-popover" class="tasks-options">
                            <div>...</div>
                        </button>
                    </div>

                    <!-- the parent task div has the main task and sub tasks,  -->
                    <div class="task-parent-div">
                        <!-- the main task div with task complete-btn, title,desc., priority and due date listed -->
                        <div id="primary-task">
                            <button>complete</button>
                            <div class="task-details">
                                <p>Title: do this</p>
                                <p>Description: do this and that</p>
                                <div class="tags">
                                    <span>Tags: </span>
                                    <!-- can have classes:low, medium, high  -->
                                    <div class="tag high-priority">
                                        <span>High </span>
                                    </div>
                                    <div class="tag">
                                        <span>birthday</span>
                                    </div>
                                    <div class="tag medium-priority">
                                        <span>medium</span>
                                    </div>
                                    <div class="tag low-priority">
                                        <span>low</span>
                                    </div>                                                                        
                                </div>
                            </div>
                        </div>
                        <div class="expand-subtask-div">
                            <label class="show-children">
                                <input type="checkbox" id="show-subtasks">
                                <span class="arrow">></span>
                            </label>    
                        </div>
                        <div class="task-children-div">
                        <!-- can remain empty if no subtasks here -->
                             <div class="subtask-1-div">
                                <input type="checkbox" id="subtask-checkbox-2-1">
                                <label for="subtask-checkbox-2-1">title: Do task 1</label>
                            </div>
                            <hr>
                            <div class="subtask-2-div">
                                <input type="checkbox" id="subtask-checkbox-2-2">
                                <label for="subtask-checkbox-2-2">title: Do task 2 </label>
                            </div>
                            <hr>
                            <div class="subtask-3-div">
                                <input type="checkbox" id="subtask-checkbox-2-3">
                                <label for="subtask-checkbox-2-3">title: Do task 3 </label>
                            </div>
                            <hr>
                            <div class="subtask-4-div">
                                <input type="checkbox" id="subtask-checkbox-2-4">
                                <label for="subtask-checkbox-2-4">title: Do task 4</label>
                            </div>                                                        
                        </div>
                    </div>    
                 </div>
<!-- example --> <!-- ----------------- -->
                  
<!-- example2 --> <!-- ----------------- -->
                <div class="full-task-div" id="1b">

                    <div class="progress-bar-btn-div">
                        <div class="task-progress-bar" 
                            data-label="0%" 
                            style="--progress-bar-width: 0%;"
                        ></div>
                        <button popovertarget="tasks-options-popover" class="tasks-options">
                            <div>...</div>
                        </button>
                    </div>

                    <!-- the parent task div has the main task and sub tasks,  -->
                    <div class="task-parent-div">
                        <!-- the main task div with task complete-btn, title,desc., priority and due date listed -->
                        <div id="primary-task">
                            <button>complete</button>
                            <div class="task-details">
                                <p>Title: do this</p>
                                <p>Description: do this and that</p>
                                <div class="tags">
                                    <span>Tags: </span>
                                    <!-- can have classes:low, medium, high  -->
                                    <div class="tag high-priority">
                                        <span>High </span>
                                    </div>
                                    <div class="tag">
                                        <span>birthday</span>
                                    </div>
                                    <div class="tag medium-priority">
                                        <span>medium</span>
                                    </div>
                                    <div class="tag low-priority">
                                        <span>low</span>
                                    </div>                                                                        
                                </div>
                            </div>
                        </div>
                        <div class="expand-subtask-div">
                            <label class="show-children">
                                <input type="checkbox" id="show-subtasks">
                                <span class="arrow">></span>
                            </label>    
                        </div>
                        <div class="task-children-div">
                        <!-- can remain empty if no subtasks here -->
                            <!-- <p>e.g: child 1</p> -->
                            <!-- <p>e.g: child 2</p> -->
                            <!-- <p>e.g: child 3</p> -->
                             <div class="subtask-1-div">
                                <input type="checkbox" id="subtask-checkbox-1">
                                <label for="subtask-checkbox-1">title: Do task 1</label>
                            </div>
                            <hr>
                            <div class="subtask-2-div">
                                <input type="checkbox" id="subtask-checkbox-2">
                                <label for="subtask-checkbox-2">title: Do task 2 </label>
                            </div>
                            <hr>
                            <div class="subtask-3-div">
                                <input type="checkbox" id="subtask-checkbox-3">
                                <label for="subtask-checkbox-3">title: Do task 3 </label>
                            </div>
                            <hr>
                            <div class="subtask-4-div">
                                <input type="checkbox" id="subtask-checkbox-4">
                                <label for="subtask-checkbox-4">title: Do task 4</label>
                            </div>                                                        
                        </div>
                    </div>    
                 </div>
<!-- example 2 --> <!-- ----------------- -->

            </div>
        </div>

    </main>

    <!-- task options popover box -->
     <dialog id="tasks-options-popover" popover >
        <button value="edit">
            <div>Edit</div>
        </button>
        <button value="move">
            <div>Move to different project</div>
        </button>
        <button value="delete">
            <div>Delete</div>
        </button>                
        <!-- <button value="move">Move to different project</button> -->
        <!-- <button value="delete">Delete</button> -->
    </dialog>

</body>
</html>
