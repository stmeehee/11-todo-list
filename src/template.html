<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Webpack Project</title>
</head>
<body>

    <div class="logo-div">
        <p>TODO-LIST</p>
    </div>

    <header>
        <div class="toolbar-div">
            <button value="addTodo" command="show-modal" commandfor="add-task-dialog">Add new task</button>
        </div>
        <button class="theme-toggle">dark/light</button>
    </header>

    
    <div class="sidebar-div">
        <div class="sidebar-main-div">
            <button value="allTasks">
                <div>
                    <img>
                    <span>All tasks</span>
                </div>            
            </button>
            <button value="UpcomingTasks">
                <div>
                    <img>
                    <span>Upcoming tasks</span>
                </div>            
            </button>    
            <button value="OverdueTasks">
                <div>
                    <img>
                    <span>Overdue tasks</span>
                </div>            
            </button>   
            <button value="CompletedTasks">
                <div>
                    <img>
                    <span>Completed Tasks</span>
                </div>            
            </button>              
            <button value="DeletedTasks">
                <div>
                    <img>
                    <span>Deleted tasks</span>
                </div>            
            </button>                                 
        </div>      
        <div class="sidebar-projects-div">
            <button value="addProject">
                <div>
                    <span>Add a project</span>
                </div>            
            </button>   
            <div class="user-projects">
                <!--  btn's here added by JS -->
            <button value="project1">
                <div>
                    <span>Project 1</span>
                </div>            
            </button>    
            <button value="project2">
                <div>
                    <span>Project 2</span>
                </div>            
            </button> 
            <button value="project3">
                <div>
                    <span>Project 3</span>
                </div>            
            </button>       
            <button value="project4">
                <div>
                    <span>Project 4</span>
                </div>            
            </button>                                              
            </div>
        </div>          
    </div>

    <main>

        <div class="sort-search-bar-div">
            <p>Sort by:</p>
            <div class="create-date-div">
                <label for="create-date-select">Date created</label>
                <select name="sortByCreationDate" id="create-date-select">
                    <!-- made earlier -->
                    <option value="ascending">Acsending</option> 
                    <!-- made sooner -->
                    <option value="descending">Descending</option>
                </select>
            </div>

            <div class="due-date-div">
                <label for="due-date-select">Date due</label>
                <select name="sortByDueDate" id="due-date-select">
                    <option value="ascending">Due later</option> <!-- past to future -->
                    <option value="descending">Due earlier</option> <!-- due starting from now to later --> 
                </select>
            </div>     
            
            <div class="completed-date-div">
                <label for="completed-date-select">Date completed</label>
                <select name="sortByCompletedDate" id="completed-date-select">
                    <!-- sort finished from past to present -->
                    <option value="ascending">Finished Sooner</option>  
                    <!-- sort finished from present to past-->
                    <option value="descending">Finished Later</option> 
                </select>
            </div>    

            <div class="priority-tag-div">
                <label for="priority-date-select">Priority</label>
                <select name="sortByPriority" id="priority-date-select">
                    <!-- 1 means max priority -->
                    <option value="ascending">Higher priority</option>  
                    <!-- vals < 1 == lower priority -->
                    <option value="descending">Lower priority</option> 
                </select>
            </div> 
                
            <div class="search-div">
                <img>
                <label for="search">Search</label>
                <input type="search" id="search" placeholder="search by title"> 
            </div>

        </div>

        <div class="viewing-div">
            <div class="all-tasks-div">
                <p>All tasks</p>

<!-- example --> <!-- ----------------- -->
                 <div class="full-task-div" id="1a">

                    <div class="progress-bar-btn-div">
                        <div class="task-progress-bar" 
                            data-label="0%" 
                            style="--progress-bar-width: 0%;"
                        ></div>
                        <button popovertarget="tasks-options-popover" class="tasks-options">
                            <div>...</div>
                        </button>
                    </div>

                    <!-- the parent task div has the main task and sub tasks,  -->
                    <div class="task-parent-div">
                        <!-- the main task div with task complete-btn, title,desc., priority and due date listed -->
                        <div id="primary-task">
                            <button class="disable">complete</button>
                            <div class="task-details hidden-div">
                                <p>Title: do this</p>
                                <p>Description: do this and that</p>
                                <!-- DUE DATE -->
                                 <p>Due date: 1/9/2026</p>
                                <div class="tags">
                                    <span>Tags: </span>
                                    <!-- can have classes:low, medium, high  -->
                                    <div class="tag high-priority">
                                        <span>High </span>
                                    </div>
                                    <div class="tag">
                                        <span>birthday</span>
                                    </div>
                                    <div class="tag medium-priority">
                                        <span>medium</span>
                                    </div>
                                    <div class="tag low-priority">
                                        <span>low</span>
                                    </div>                                                                        
                                </div>
                            </div>
                            <!-- TODO -->
                            <!-- Edit task: Add a div with fields -->
                            <div class="task-details-edit">
                                <div class="edit-field-selectors">
                                    <label><input type="radio" name="edit-field" value="edit-title-div">Title</label>
                                    <label><input type="radio" name="edit-field" value="edit-date-div">Date</label>
                                    <label><input type="radio" name="edit-field" value="edit-desc-div">Description</label>
                                    <label><input type="radio" name="edit-field" value="edit-time-div">Time</label>
                                    <label><input type="radio" name="edit-field" value="edit-tags-div">Tags</label>
                                </div>

                                <form>
                                    <fieldset>
                                        <div class="hidden-div edit-title-div">                                            
                                            <label for="edit-title">Title: </label>
                                            <input type="text" id="edit-title">
                                        </div>
                                        <div class="hidden-div edit-date-div">
                                            <label for="edit-date">Date: </label>
                                            <input type="date" id="edit-date">
                                        </div>                                 
                                        <div class="hidden-div edit-desc-div">
                                            <label for="edit-desc">Desc.: </label>
                                            <input type="text" id="edit-desc">
                                        </div>  
                                        <div class="hidden-div edit-time-div">
                                            <label for="edit-time">Time: </label>
                                            <input type="time" id="edit-time">
                                        </div>     
                                        <div class="hidden-div edit-tags-div"> 
                                            <label for="edit-tags">Tags: </label>
                                            <input type="text" id="edit-tags">
                                        </div>  
                                    </fieldset>
                                    <div>
                                        <button type="button" class="edit-note">edit note</button>
                                        <button type="button" class="confirm-edit">✓</button>
                                        <button type="button" class="confirm-edit">X</button>                                        
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="expand-adjacent">
                            <label class="show-children">
                                <input type="checkbox" class="expand">
                                <span class="arrow">></span>
                            </label>    
                        </div>
                        <div class="hidden-div">
                        <!-- can remain empty if no subtasks here -->
                             <div class="subtask-1-div">
                                <input type="checkbox" id="subtask-checkbox-2-1">
                                <label for="subtask-checkbox-2-1">title: Do task 1</label>
                            </div>
                            <hr>
                            <div class="subtask-2-div">
                                <input type="checkbox" id="subtask-checkbox-2-2">
                                <label for="subtask-checkbox-2-2">title: Do task 2 </label>
                            </div>
                            <hr>
                            <div class="subtask-3-div">
                                <input type="checkbox" id="subtask-checkbox-2-3">
                                <label for="subtask-checkbox-2-3">title: Do task 3 </label>
                            </div>
                            <hr>
                            <div class="subtask-4-div">
                                <input type="checkbox" id="subtask-checkbox-2-4">
                                <label for="subtask-checkbox-2-4">title: Do task 4</label>
                            </div>                                                        
                        </div>
                    </div>    
                 </div>
<!-- example --> <!-- ----------------- -->
                  
<!-- example2 --> <!-- ----------------- -->
                <div class="full-task-div" id="1b">

                    <div class="progress-bar-btn-div">
                        <div class="task-progress-bar" 
                            data-label="0%" 
                            style="--progress-bar-width: 0%;"
                        ></div>
                        <button popovertarget="tasks-options-popover" class="tasks-options">
                            <div>...</div>
                        </button>
                    </div>

                    <!-- the parent task div has the main task and sub tasks,  -->
                    <div class="task-parent-div">
                        <!-- the main task div with task complete-btn, title,desc., priority and due date listed -->
                        <div id="primary-task">
                            <button class="disable">complete</button>
                            <div class="task-details">
                                <p>Title: do this</p>
                                <p>Description: do this and that</p>
                                <div class="tags">
                                    <span>Tags: </span>
                                    <!-- can have classes:low, medium, high  -->
                                    <div class="tag high-priority">
                                        <span>High </span>
                                    </div>
                                    <div class="tag">
                                        <span>birthday</span>
                                    </div>
                                    <div class="tag medium-priority">
                                        <span>medium</span>
                                    </div>
                                    <div class="tag low-priority">
                                        <span>low</span>
                                    </div>                                                                        
                                </div>
                            </div>
                        </div>
                        <div class="expand-adjacent">
                            <label class="show-children">
                                <input type="checkbox" class="expand">
                                <span class="arrow">></span>
                            </label>    
                        </div>
                        <div class="hidden-div">
                        <!-- can remain empty if no subtasks here -->
                            <!-- <p>e.g: child 1</p> -->
                            <!-- <p>e.g: child 2</p> -->
                            <!-- <p>e.g: child 3</p> -->
                             <div class="subtask-1-div">
                                <input type="checkbox" id="subtask-checkbox-1">
                                <label for="subtask-checkbox-1">title: Do task 1</label>
                            </div>
                            <hr>
                            <div class="subtask-2-div">
                                <input type="checkbox" id="subtask-checkbox-2">
                                <label for="subtask-checkbox-2">title: Do task 2 </label>
                            </div>
                            <hr>
                            <div class="subtask-3-div">
                                <input type="checkbox" id="subtask-checkbox-3">
                                <label for="subtask-checkbox-3">title: Do task 3 </label>
                            </div>
                            <hr>
                            <div class="subtask-4-div">
                                <input type="checkbox" id="subtask-checkbox-4">
                                <label for="subtask-checkbox-4">title: Do task 4</label>
                            </div>                                                        
                        </div>
                    </div>    
                 </div>
<!-- example 2 --> <!-- ----------------- -->

            </div>
        </div>

    </main>

    <!-- task options popover box -->
     <dialog id="tasks-options-popover" popover >
        <button value="edit">
            <div>Edit</div>
        </button>
        <button value="move">
            <div>Move to different project</div>
        </button>
        <button value="delete">
            <div>Delete</div>
        </button>                
        <!-- <button value="move">Move to different project</button> -->
        <!-- <button value="delete">Delete</button> -->
    </dialog>
    
    <!-- Add new task dialogue box -->
     <dialog id="add-task-dialog">
        <form>
            <div class="title">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="desc">
                <label for="desc">Description</label>
                <input type="text" id="desc" name="desc">                
            </div>
            <div class="date">
                <label for="date">Due date</label>
                <input type="date" id="date" name="date" required>                
            </div>
            <div class="time">
                <!-- TODO -->
                <!-- either current time, or choose -->
                 <fieldset>
                    <div>
                        <label for="now">this time</label>
                        <input type="radio" id="now" name="now-or-pick-time" value="now" checked>
                    </div>
                    <div class="pick-time" >
                        <div>
                            <label for="time-picker">Pick a time</label>
                            <input type="radio" id="time-picker" name="now-or-pick-time" value="pick-time">
                        </div>
                        <input type="time" name="pick-time" value="00:00">
                    </div>
                </fieldset>

            </div>
            <div class="priority">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">    
                    <option value="high">High</option>       
                    <option value="medium">Medium</option> 
                    <option value="low">Low</option>  
                </select>    
            </div>  
            <hr>
            <!-- add form btn -->
            <div class="expand-adjacent">
                <label class="show-children add-note-btn .button">
                    <input type="checkbox" class="expand">
                    <span>Add note</span>
                </label>    
            </div>   
            
            <div class="hidden-div">
                <div class="note">
                    <!-- <label for="note">Add note</label> -->
                    <textarea id="note" name="note" placeholder="(optional)" rows="5"></textarea>                
                </div>
            </div>                 

            <hr>
            <div class="project-select">
                <label for="project-select">Add to existing project</label>
                <select id="project-select" name="projectSelect" >  
                    <option value="proj1">This doesnt exist!</option>              
                    <!-- TODO: add projects available by user -->
                </select>
            </div>                                               
            <hr>
            <div class="new-subtask">

                <div class="expand-adjacent">
                    <label class="show-children add-subtask-btn">
                        <input type="checkbox" class="expand">
                        <span>Add subtask</span>
                    </label>    
                </div>
                <!-- NOte: add new input label/input elements for each click to expand-adjacent -->
                <div class="hidden-div">
                    <div class="new-subtask">
                        <label>subtask 1
                            <input type="text" name="subtaskTitle1">
                        </label>
                    </div>
                </div> 

            </div>    
            <hr>
            <div>
                <button formmethod="dialog" type="submit"> Add task</button>
                <!-- <button formmethod="dialog" type="submit" command="close" formnovalidate>Cancel</button>  -->
                <button  commandfor="add-task-dialog" command="close" type="button">Cancel</button>  
            </div>
        </form>
        <!-- <button  commandfor="add-task-dialog" command="close" formnovalidate>Cancel</button>   -->
     </dialog>
     

</body>
</html>
