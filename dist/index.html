<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11-todo-list</title><script defer="defer" src="app.bundle.js"></script></head><body><div class="logo-div"><p>TODO-LIST</p></div><header><div class="toolbar-div"><button class="add-todo" value="addTodo" command="show-modal" commandfor="add-task-dialog">Add new task</button></div><button class="theme-toggle">dark/light</button></header><div class="sidebar-div"><div class="sidebar-main-div"><button value="allTasks"><div><img> <span>All tasks</span></div></button> <button value="upcomingTasks"><div><img> <span>Upcoming tasks</span></div></button> <button value="overdueTasks"><div><img> <span>Overdue tasks</span></div></button> <button value="completedTasks"><div><img> <span>Completed Tasks</span></div></button> <button value="deletedTasks"><div><img> <span>Deleted tasks</span></div></button></div><div class="sidebar-projects-div"><div class="expand-adjacent"><label class="add-project">Add a Project <input type="checkbox" class="expand"></label></div><div class="add-project-name hidden-div"><form data-form-name="newProject"><label for="add-project-name">name</label> <input id="add-project-name" name="newProject" required> <button class="small-add-btn">add</button></form></div><hr><div class="user-projects shift-left"></div></div></div><main><div class="sort-search-bar-div"></div><div class="viewing-div"><hr></div></main><dialog id="tasks-options-popover" class="popup-menu" data-anchored-to-task-id="" popover><button type="button" commandfor="tasks-options-popover" command="hide-popover"><div class="popover-edit" data-class_show="task-details-edit">Edit</div></button> <button popovertarget="existing-projects-popover"><div class="popover-move">Move to different project</div></button> <button type="button" commandfor="tasks-options-popover" command="hide-popover"><div class="popover-reset hidden" data-class_show="task-details">Reset</div></button> <button type="button" commandfor="tasks-options-popover" command="hide-popover"><div class="popover-delete">Delete</div></button></dialog><dialog id="existing-projects-popover" class="popup-menu" data-anchored-to-task-id="" popover><button data-project-name="All tasks" type="button" commandfor="existing-projects-popover" command="hide-popover"><div>All tasks</div></button></dialog><dialog id="add-task-dialog"><form data-form-name="newForm"><p>New task details</p><div class="title"><label for="title">Title:</label> <input id="title" name="title" required></div><div class="desc"><label for="desc">Description</label> <input id="desc" name="desc"></div><hr><div class="date"><label for="date">Due date</label> <input type="date" id="date" name="date" required></div><div class="time"><fieldset><div><label for="now">this time</label> <input type="radio" id="now" name="pickTime" value="now" checked="checked"></div><div class="pick-time"><div><label for="time-picker">Pick a time</label> <input type="radio" id="time-picker" name="pickTime" value="notNow"></div><input type="time" name="customTime" value="00:00"></div></fieldset></div><hr><div class="priority"><label for="priority">Priority</label> <select id="priority" name="priority"><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div><hr><div class="project-select"><div class="existing-project"><label for="project-select">Add to existing project:</label> <select id="project-select" name="existingProject"></select></div><div class="new-project"><label for="new-project">Add to new project:</label> <input id="new-project" name="newProject"></div></div><hr><div class="expand-adjacent"><label class="show-children add-note-btn .button"><input type="checkbox" class="expand"> <span>Add note</span></label></div><div class="hidden-div"><div class="note"><textarea id="note" name="note" placeholder="(optional)" rows="5"></textarea></div></div><hr><div class="add-subtask-option"><div class="expand-adjacent"><label class="show-children add-subtask-btn"><input type="checkbox" class="expand add-subtask"> <span>Add subtask</span></label></div><div class="hidden-div"><button type="button" class="new-subtask small-add-btn">+</button><div class="new-subtask-divs"><div class="subtask-div"><label class="subtask-1">subtask 1 <input name="subtaskTitle1"></label> <button type="button" class="remove-subtask small-delete-btn">X</button></div></div></div></div><hr><div><button type="submit">Add task</button> <button commandfor="add-task-dialog" command="close" type="button">Cancel</button></div></form></dialog></body></html>
